# Alembic configuration for APIx.
#
# The database URL is NOT stored here. It is assembled at runtime by
# db/settings.py from the environment, so no credential is ever committed.
#
#   alembic -c db/alembic.ini upgrade head
#   alembic -c db/alembic.ini downgrade base

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/.. %(here)s/../packages
path_separator = space
timezone = UTC
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
