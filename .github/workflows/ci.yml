# CI for APIx.
#
# The audit previously cited "CI" as evidence that automated testing was in
# place. It was not: there were tests, and nothing ran them.
#
# The first version of this workflow then failed three times, because it
# hand-rolled a database setup that differed from the one developers actually
# use. It ran `alembic upgrade` against the main database as the wrong role,
# when the test fixtures create and migrate their own database anyway. This
# version runs what a developer runs, and nothing else.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Must match APIX_DB_SUPERUSER / _PASSWORD below, and the local dev
          # defaults in db/settings.py. A mismatch here fails deep inside the
          # fixtures rather than at connection time, which is hard to read.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: apix_local_dev_only
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Every variable db/settings.py reads, set explicitly. Relying on the
      # local-dev fallbacks would mean CI silently tests a different
      # configuration from the one it appears to declare.
      APIX_DB_HOST: 127.0.0.1
      APIX_DB_PORT: "5433"
      APIX_DB_NAME: apix
      APIX_DB_SUPERUSER: postgres
      APIX_DB_SUPERUSER_PASSWORD: apix_local_dev_only
      APIX_MIGRATOR_USER: apix_migrator
      APIX_MIGRATOR_PASSWORD: apix_migrator_local_dev_only
      APIX_APP_USER: apix_app
      APIX_APP_PASSWORD: apix_app_local_dev_only
      APIX_TEST_DB_NAME: apix_test
      # The compliance gate refuses to crawl anonymously. Tests stub the
      # transport, but the gate still requires a contact address.
      APIX_CONTACT_URL: https://github.com/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5433 -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready"; exit 1

      # Exactly what a developer runs: create the database, migrate it as the
      # superuser (revision 0003 creates the two roles), and seed it. The test
      # fixtures then build their own separate test database on top.
      - name: Initialise database
        run: python scripts/init_db.py

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy --strict packages/

      - name: Tests
        run: python -m pytest -q

      # --- gates on load-bearing properties --------------------------------
      # Each already runs inside the suite above. Repeated as named steps so a
      # failure is legible in the Actions summary without reading pytest output:
      # "index values drifted" is a very different signal from "a test failed".

      - name: "Gate: index values have not drifted"
        run: python -m pytest tests/unit/test_index_engine_golden.py -q

      - name: "Gate: no bypass path around the compliance gate"
        run: python -m pytest tests/unit/test_no_bypass_path_exists.py -q

      - name: "Gate: no float on a money path"
        run: python -m pytest tests/unit/test_no_float_in_money_path.py -q

      - name: "Gate: TLS verification is never disabled"
        run: python -m pytest tests/unit/test_tls_ladder.py -q

      - name: "Gate: immutability and provenance constraints hold"
        run: |
          python -m pytest tests/integration/test_constraints.py \
                           tests/integration/test_roles_and_privileges.py -q
