# CI for APIx.
#
# The audit previously cited "CI" as evidence that automated testing was in
# place. It was not: there were tests, and nothing ran them. This closes that
# gap rather than restating the claim.
#
# The gates below are the ones that protect properties the project actually
# depends on, not a generic lint-and-test template.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: apix_local_dev_only
          POSTGRES_DB: apix
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APIX_DB_HOST: 127.0.0.1
      APIX_DB_PORT: "5433"
      # The compliance gate refuses to crawl anonymously. Tests stub the
      # transport, but the gate still requires a contact address.
      APIX_CONTACT_URL: https://github.com/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrate
        run: python -m alembic -c db/alembic.ini upgrade head

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy --strict packages/

      - name: Tests
        run: python -m pytest -q

      # --- the gates that protect load-bearing properties ------------------
      # Each of these already runs inside the suite above. They are repeated as
      # named steps so that a failure is legible in the Actions summary without
      # anyone reading pytest output: "golden index values changed" is a very
      # different signal from "a test failed".

      - name: "Gate: index values have not drifted"
        run: python -m pytest tests/unit/test_index_engine_golden.py -q

      - name: "Gate: no bypass path around the compliance gate"
        run: python -m pytest tests/unit/test_no_bypass_path_exists.py -q

      - name: "Gate: no float on a money path"
        run: python -m pytest tests/unit/test_no_float_in_money_path.py -q

      - name: "Gate: TLS verification is never disabled"
        run: python -m pytest tests/unit/test_tls_ladder.py -q

      - name: "Gate: immutability and provenance constraints hold"
        run: python -m pytest tests/integration/test_constraints.py tests/integration/test_roles_and_privileges.py -q
